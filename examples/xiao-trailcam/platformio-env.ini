; Append to ESPIDFORTH's platformio.ini to build for the XIAO ESP32S3 Sense.
;
; The stock esp32s3 env targets a devkitc-1 with octal PSRAM; the XIAO carries
; an ESP32-S3R8 whose 8 MB PSRAM is also octal, so the PSRAM settings in
; sdkconfig.defaults.esp32s3 carry over unchanged. What differs is the flash
; size (8 MB) and the partition layout needed to fit the camera driver.

[env:xiao_s3_sense]
extends = espidforth_base
board = seeed_xiao_esp32s3
board_build.flash_mode = qio
board_build.partitions = partitions.csv
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.xiao_s3_sense"
