# esp32-camera pulls espressif/esp_jpeg transitively.
#
# Verified on hardware with esp32-camera 2.1.7 and esp_jpeg 1.3.1 under
# ESP-IDF 5.3.1 (2026-09-19). The caret keeps you inside 2.x — a bare
# ">=2.0.0" would happily accept a 3.x with breaking driver changes.
#
# This directory has no dependencies.lock on purpose: it is sample source to
# copy into your own project, and your project's lock is the one that matters.
# If you deploy from it, commit the lock your build generates.
dependencies:
  espressif/esp32-camera:
    version: "^2.0.0"
